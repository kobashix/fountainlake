<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>News Scout Pro | Fountain Lake Network</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .scout-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-top: 4px solid var(--cobra-gold);
      position: relative;
    }
    .scout-img {
      width: 100%; height: 150px; object-fit: cover;
      background: #1e293b; display: none;
    }
    .scout-img.has-image { display: block; }
    
    /* Loading Spinner */
    .spinner {
      display: inline-block; width: 1rem; height: 1rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%; border-top-color: #fff;
      animation: spin 1s ease-in-out infinite; margin-right: 5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success Message */
    .success-box {
      background: #22c55e; color: black; padding: 0.5rem;
      border-radius: 4px; text-align: center; font-weight: bold;
      margin-top: 0.5rem; display: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <div style="margin-top: 2rem; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h2 class="brand" style="color:white; margin-bottom: 0.5rem;">Scout Pro 🕵️‍♂️</h2>
        <p style="color: var(--text-muted);">AI-Powered News Monitor</p>
      </div>
      <button onclick="loadFeed()" class="btn btn-outline">🔄 Refresh</button>
    </div>

    <div id="feed" class="grid" style="margin-top: 2rem;">
      <p class="muted">Scouting for news...</p>
    </div>
  </main>

  <script>
    // YOUR WORDPRESS URL
    const WP_ADMIN_URL = "https://cms.fountainlake.net/wp-admin/post-new.php";

    function loadFeed() {
      const container = document.getElementById('feed');
      container.innerHTML = '<p class="muted">Scanning web...</p>';

      fetch('/api/scout')
        .then(res => res.json())
        .then(data => {
          if (!data.news || data.news.length === 0) {
            container.innerHTML = '<p>No news found.</p>'; return;
          }

          container.innerHTML = data.news.map((item, index) => {
            const imgClass = item.image ? 'has-image' : '';
            const imgTag = item.image ? `<img src="${item.image}" class="scout-img ${imgClass}">` : '';

            // SAFE TITLE ENCODING
            // We store the title in a data attribute to avoid quote escaping issues
            const safeTitle = item.title.replace(/"/g, '&quot;');

            return `
              <div class="card scout-card" id="card-${index}" data-title="${safeTitle}" data-url="${item.link}">
                <div>
                  ${imgTag}
                  <div class="kicker" style="color: #94a3b8; margin-top:1rem;">${item.source} • ${item.date}</div>
                  <h3 style="margin: 0.5rem 0; font-size: 1.1rem;">
                    <a href="${item.link}" target="_blank" style="text-decoration:none; color:white;">${item.title}</a>
                  </h3>
                </div>
                
                <div class="action-area" style="margin-top: 1.5rem; display:grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                  <a href="${item.link}" target="_blank" class="btn btn-outline" style="text-align:center; font-size:0.8rem;">Original</a>
                  <button onclick="magicDraft(${index})" class="btn" style="text-align:center; font-size:0.8rem; background: linear-gradient(45deg, #7c3aed, #db2777); color:white; border:none; cursor:pointer;">
                    ✨ Magic Draft
                  </button>
                </div>
                <div class="error-msg" style="color: #ef4444; font-size: 0.8rem; margin-top: 0.5rem; display:none;"></div>
              </div>
            `;
          }).join('');
        })
        .catch(err => {
            console.error(err);
            document.getElementById('feed').innerHTML = `<p style="color:red">Error loading feed: ${err.message}</p>`;
        });
    }

    async function magicDraft(index) {
      const card = document.getElementById(`card-${index}`);
      const btn = card.querySelector('button');
      const errorMsg = card.querySelector('.error-msg');
      
      const url = card.dataset.url;
      const title = card.dataset.title;

      const originalText = btn.innerHTML;
      btn.innerHTML = `<div class="spinner"></div> Hunter-Killer...`; // Cool loading status
      btn.disabled = true;
      errorMsg.style.display = 'none';

      try {
        const apiUrl = `/api/rewrite?url=${encodeURIComponent(url)}&title=${encodeURIComponent(title)}`;
        const res = await fetch(apiUrl);
        const data = await res.json();
        
        if (data.error) throw new Error(data.error);

        let content = data.content || "";
        let wpTitle = title;
        
        // Extract H1 for Title if Gemini made one
        if (content.includes("<h1>")) {
            const match = content.match(/<h1>(.*?)<\/h1>/);
            if (match) {
                wpTitle = match[1];
                content = content.replace(/<h1>.*?<\/h1>/, ""); // Remove from body
            }
        }

        // --- NEW: INJECT IMAGE BLOCK ---
        // If the worker found an image, add it to the top of the post
        if (data.image) {
            const imageBlock = `<figure class="wp-block-image aligncenter size-large"><img src="${data.image}" alt="News Image"/></figure>
            `;
            
            content = imageBlock + "\n\n" + content;
        }

        const finalUrl = `${WP_ADMIN_URL}?post_title=${encodeURIComponent(wpTitle)}&content=${encodeURIComponent(content)}`;

        btn.remove();
        const actionArea = card.querySelector('.action-area');
        
        const successLink = document.createElement('a');
        successLink.href = finalUrl;
        successLink.target = "_blank";
        successLink.className = "btn";
        successLink.style.cssText = "text-align:center; font-size:0.8rem; background: #22c55e; color:black; border:none; font-weight:bold; text-decoration:none; display:flex; align-items:center; justify-content:center; grid-column: 2;";
        successLink.innerHTML = "🚀 Open Draft";
        
        actionArea.appendChild(successLink);

      } catch (err) {
        console.error(err);
        btn.innerHTML = "❌ Failed";
        errorMsg.innerText = err.message;
        errorMsg.style.display = 'block';
        
        setTimeout(() => { 
            btn.innerHTML = originalText; 
            btn.disabled = false; 
        }, 3000);
      }
    }
    loadFeed();
  </script>
</body>
</html>
