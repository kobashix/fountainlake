<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>News Scout Pro | Fountain Lake Network</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .scout-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-top: 4px solid var(--cobra-gold);
      position: relative;
    }
    .scout-img {
      width: 100%; height: 150px; object-fit: cover;
      background: #1e293b; display: none;
    }
    .scout-img.has-image { display: block; }
    
    .spinner {
      display: inline-block; width: 1rem; height: 1rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%; border-top-color: #fff;
      animation: spin 1s ease-in-out infinite; margin-right: 5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      color: #ef4444; font-size: 0.8rem; margin-top: 0.5rem; display: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <div style="margin-top: 2rem; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h2 class="brand" style="color:white; margin-bottom: 0.5rem;">Scout Pro 🕵️‍♂️</h2>
        <p style="color: var(--text-muted);">AI-Powered News Monitor</p>
      </div>
      <button onclick="loadFeed()" class="btn btn-outline">🔄 Refresh</button>
    </div>

    <div id="feed" class="grid" style="margin-top: 2rem;">
      <p class="muted">Scouting for news...</p>
    </div>
  </main>

  <script>
    // CONFIGURATION
    const WP_ADMIN_URL = "https://cms.fountainlake.net/wp-admin/post-new.php?post_type=news";

    function loadFeed() {
      const container = document.getElementById('feed');
      container.innerHTML = '<p class="muted">Scanning web...</p>';

      fetch('/api/scout')
        .then(res => res.json())
        .then(data => {
          if (!data.news || data.news.length === 0) {
            container.innerHTML = '<p>No news found.</p>'; return;
          }

          container.innerHTML = data.news.map((item, index) => {
            const imgClass = item.image ? 'has-image' : '';
            const imgTag = item.image ? `<img src="${item.image}" class="scout-img ${imgClass}">` : '';
            const safeTitle = item.title.replace(/"/g, '&quot;');

            return `
              <div class="card scout-card" id="card-${index}" data-title="${safeTitle}" data-url="${item.link}">
                <div>
                  ${imgTag}
                  <div class="kicker" style="color: #94a3b8; margin-top:1rem;">${item.source} • ${item.date}</div>
                  <h3 style="margin: 0.5rem 0; font-size: 1.1rem;">
                    <a href="${item.link}" target="_blank" style="text-decoration:none; color:white;">${item.title}</a>
                  </h3>
                </div>
                
                <div class="action-area" style="margin-top: 1.5rem; display:grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                  <a href="${item.link}" target="_blank" class="btn btn-outline" style="text-align:center; font-size:0.8rem;">Original</a>
                  <button onclick="magicDraft(${index})" class="btn" style="text-align:center; font-size:0.8rem; background: linear-gradient(45deg, #7c3aed, #db2777); color:white; border:none; cursor:pointer;">
                    ✨ Magic Draft
                  </button>
                </div>
                <div class="error-msg"></div>
              </div>
            `;
          }).join('');
        })
        .catch(err => {
            document.getElementById('feed').innerHTML = `<p style="color:red">Error: ${err.message}</p>`;
        });
    }

    async function magicDraft(index) {
      const card = document.getElementById(`card-${index}`);
      const btn = card.querySelector('button');
      const actionArea = card.querySelector('.action-area');
      const errorMsg = card.querySelector('.error-msg');
      
      const url = card.dataset.url;
      const title = card.dataset.title;

      btn.innerHTML = `<div class="spinner"></div> Scanning & Copying...`;
      btn.disabled = true;
      errorMsg.style.display = 'none';

      try {
        const apiUrl = `/api/rewrite?url=${encodeURIComponent(url)}&title=${encodeURIComponent(title)}`;
        const res = await fetch(apiUrl);
        const data = await res.json();
        
        if (data.error) throw new Error(data.error);

        let content = data.content || "";
        let wpTitle = title;
        
        const h1Match = content.match(/<h1>(.*?)<\/h1>/);
        if (h1Match) {
            wpTitle = h1Match[1];
            content = content.replace(/<h1>.*?<\/h1>/, "");
        }

        let clipboardHTML = "";
        if (data.image) {
            clipboardHTML += `<img src="${data.image}" alt="Featured News Image" /><br/><br/>`;
        }
        clipboardHTML += content;

        const type = "text/html";
        const blob = new Blob([clipboardHTML], { type });
        const dataItem = [new ClipboardItem({ [type]: blob })];
        await navigator.clipboard.write(dataItem);

        btn.remove();
        
        const wpUrl = `${WP_ADMIN_URL}&post_title=${encodeURIComponent(wpTitle)}`;
        
        const successBtn = document.createElement('a');
        successBtn.href = wpUrl;
        successBtn.target = "_blank";
        successBtn.className = "btn";
        successBtn.style.cssText = "text-align:center; font-size:0.8rem; background: #22c55e; color:black; border:none; font-weight:bold; text-decoration:none; display:flex; align-items:center; justify-content:center; grid-column: 2; cursor:pointer;";
        successBtn.innerHTML = "📋 Copied! Create News";
        
        const instruction = document.createElement('div');
        instruction.style.cssText = "grid-column: 1 / -1; font-size: 0.75rem; color: #22c55e; text-align: center; margin-top: 8px; font-style: italic;";
        instruction.innerHTML = "News draft in clipboard. Click button, then <b>Ctrl+V</b> in the editor.";

        actionArea.appendChild(successBtn);
        actionArea.appendChild(instruction);

      } catch (err) {
        console.error(err);
        btn.innerHTML = "❌ Failed";
        errorMsg.innerText = err.message;
        errorMsg.style.display = 'block';
        setTimeout(() => { btn.innerHTML = "✨ Magic Draft"; btn.disabled = false; }, 3000);
      }
    }

    loadFeed();
  </script>
</body>
</html>
