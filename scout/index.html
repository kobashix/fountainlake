<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>News Scout Pro | Fountain Lake Network</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .scout-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-top: 4px solid var(--cobra-gold);
    }
    .scout-img {
      width: 100%; height: 150px; object-fit: cover;
      background: #1e293b; display: none;
    }
    .scout-img.has-image { display: block; }
    
    /* Loading Spinner */
    .spinner {
      display: inline-block; width: 1rem; height: 1rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%; border-top-color: #fff;
      animation: spin 1s ease-in-out infinite; margin-right: 5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="container">
    <div style="margin-top: 2rem; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h2 class="brand" style="color:white; margin-bottom: 0.5rem;">Scout Pro 🕵️‍♂️</h2>
        <p style="color: var(--text-muted);">AI-Powered News Monitor</p>
      </div>
      <button onclick="loadFeed()" class="btn btn-outline">🔄 Refresh</button>
    </div>

    <div id="feed" class="grid" style="margin-top: 2rem;">
      <p class="muted">Scouting for news...</p>
    </div>
  </main>

  <script>
    const WP_ADMIN_URL = "https://cms.fountainlake.net/wp-admin/post-new.php";

    function loadFeed() {
      const container = document.getElementById('feed');
      container.innerHTML = '<p class="muted">Scanning web...</p>';

      fetch('/api/scout')
        .then(res => res.json())
        .then(data => {
          if (!data.news || data.news.length === 0) {
            container.innerHTML = '<p>No news found.</p>'; return;
          }

          container.innerHTML = data.news.map((item, index) => {
            const imgClass = item.image ? 'has-image' : '';
            const imgTag = item.image ? `<img src="${item.image}" class="scout-img ${imgClass}">` : '';

            return `
              <div class="card scout-card" id="card-${index}">
                <div>
                  ${imgTag}
                  <div class="kicker" style="color: #94a3b8; margin-top:1rem;">${item.source} • ${item.date}</div>
                  <h3 style="margin: 0.5rem 0; font-size: 1.1rem;">
                    <a href="${item.link}" target="_blank" style="text-decoration:none; color:white;">${item.title}</a>
                  </h3>
                </div>
                
                <div style="margin-top: 1.5rem; display:grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                  <a href="${item.link}" target="_blank" class="btn btn-outline" style="text-align:center; font-size:0.8rem;">Original</a>
                  <button onclick="magicDraft('${item.link}', ${index})" class="btn" style="text-align:center; font-size:0.8rem; background: linear-gradient(45deg, #7c3aed, #db2777); color:white; border:none;">
                    ✨ Magic Draft
                  </button>
                </div>
              </div>
            `;
          }).join('');
        });
    }

    // The Magic Function
// The Fixed Magic Function (sends Title now)
    async function magicDraft(url, index) {
      const card = document.getElementById(`card-${index}`);
      const btn = card.querySelector('.action-area button');
      const actionArea = card.querySelector('.action-area');
      
      // GRAB THE TITLE from the link in the card
      const titleLink = card.querySelector('h3 a');
      const titleText = titleLink ? titleLink.innerText : "Local News";
      
      const originalText = btn.innerHTML;
      btn.innerHTML = `<div class="spinner"></div> Writing...`;
      btn.disabled = true;

      try {
        // PASS TITLE AND URL
        const apiUrl = `/api/rewrite?url=${encodeURIComponent(url)}&title=${encodeURIComponent(titleText)}`;
        
        const res = await fetch(apiUrl);
        const data = await res.json();
        
        if (data.error) throw new Error(data.error);

        // Prepare WordPress Data
        let content = data.content;
        let wpTitle = titleText; // Default to original title
        
        // Try to extract new title from H1 tag if Gemini wrote one
        const h1Match = content.match(/<h1>(.*?)<\/h1>/);
        if (h1Match) {
            wpTitle = h1Match[1];
            // Remove the H1 from content so it doesn't duplicate in the body
            content = content.replace(/<h1>.*?<\/h1>/, "");
        }

        const finalUrl = `${WP_ADMIN_URL}?post_title=${encodeURIComponent(wpTitle)}&content=${encodeURIComponent(content)}`;
        
        // Success Button
        btn.remove();
        const successLink = document.createElement('a');
        successLink.href = finalUrl;
        successLink.target = "_blank";
        successLink.className = "btn";
        successLink.style.cssText = "text-align:center; font-size:0.8rem; background: #22c55e; color:black; border:none; font-weight:bold; text-decoration:none; display:flex; align-items:center; justify-content:center;";
        successLink.innerHTML = "🚀 Open Draft";
        actionArea.appendChild(successLink);

      } catch (err) {
        console.error(err);
        btn.innerHTML = "❌ Error";
        alert("Could not rewrite: " + err.message);
        setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 3000);
      }
    }
    loadFeed();
  </script>
</body>
</html>
