<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Your Business | Fountain Lake Network</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <script src="/assets/js/script.js"></script>

  <main class="container">
    <div style="max-width: 600px; margin: 3rem auto;">
      <h2 class="brand" style="color:white; margin-bottom: 0.5rem;">Add Your Business</h2>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">
        Listings are free. We only accept businesses that physically serve the Fountain Lake area.
      </p>

      <form id="biz-submit-form" class="card" style="display: flex; flex-direction: column; gap: 1.5rem; background: #1e293b; padding: 2rem; border-radius: 8px; border: 1px solid var(--border);">
        
        <!-- Business Name -->
        <div>
          <label class="kicker" for="title" style="display:block; margin-bottom:0.5rem;">Business Name</label>
          <input type="text" id="title" required 
            style="width: 100%; padding: 0.8rem; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 6px; font-size: 1rem;"
            placeholder="e.g. Fountain Lake Hardware">
        </div>

        <!-- Grid for Category & Phone -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label class="kicker" for="category" style="display:block; margin-bottom:0.5rem;">Category</label>
            <select id="category" style="width: 100%; padding: 0.8rem; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 6px; font-size: 1rem;">
              <option value="Dining">Dining</option>
              <option value="Retail">Retail</option>
              <option value="Services">Services</option>
              <option value="Automotive">Automotive</option>
              <option value="Health">Health</option>
              <option value="Home & Repair">Home & Repair</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label class="kicker" for="phone" style="display:block; margin-bottom:0.5rem;">Phone</label>
            <input type="tel" id="phone" 
              style="width: 100%; padding: 0.8rem; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 6px; font-size: 1rem;"
              placeholder="501-555-0199">
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="kicker" for="description" style="display:block; margin-bottom:0.5rem;">Description</label>
          <textarea id="description" required rows="4"
            style="width: 100%; padding: 0.8rem; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 6px; font-family: inherit; font-size: 1rem;"
            placeholder="Tell us what you offer and your hours..."></textarea>
        </div>

        <!-- Website -->
        <div>
          <label class="kicker" for="website" style="display:block; margin-bottom:0.5rem;">Website / Facebook</label>
          <input type="url" id="website" 
            style="width: 100%; padding: 0.8rem; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 6px; font-size: 1rem;"
            placeholder="https://...">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn" style="border:none; cursor:pointer; width: 100%; font-size: 1rem; padding: 1rem;">Submit for Review</button>
        <p id="status-msg" style="text-align: center; font-size: 0.9rem; margin-top: 1rem; min-height: 1.5rem;"></p>
      </form>

      <div style="text-align: center; margin-top: 2rem;">
        <a href="/business/" style="color: var(--text-muted); text-decoration: none;">&larr; Back to Directory</a>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('biz-submit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = e.target.querySelector('button');
      const msg = document.getElementById('status-msg');
      
      // Collect Data
      const payload = {
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        category: document.getElementById('category').value,
        phone: document.getElementById('phone').value,
        website: document.getElementById('website').value
      };

      // Lock UI
      btn.disabled = true;
      btn.innerText = "Sending...";
      msg.innerText = "";

      try {
        const res = await fetch('/api/submit-business', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const json = await res.json();
        
        if (json.success) {
          document.getElementById('biz-submit-form').innerHTML = `
            <div style="text-align:center; padding: 3rem 1rem;">
              <h3 style="color: var(--cobra-gold); font-size: 2rem; margin-bottom: 1rem;">Received!</h3>
              <p style="color: var(--text-muted); font-size: 1.1rem;">Your listing has been sent to the editor.</p>
              <a href="/business/" class="btn btn-outline" style="margin-top:2rem; display:inline-block;">Back to Directory</a>
            </div>
          `;
        } else {
          throw new Error(json.message || "Unknown error");
        }
      } catch (err) {
        msg.style.color = "#ff6b6b";
        msg.innerText = "Error: " + err.message;
        btn.disabled = false;
        btn.innerText = "Try Again";
      }
    });
  </script>
</body>
</html>
