<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submit News | Fountain Lake Network</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <script src="/assets/js/script.js"></script> <main class="container">
    <div style="margin-top: 2rem; max-width: 600px; margin-left: auto; margin-right: auto;">
      <h2 class="brand" style="color:white; margin-bottom: 0.5rem;">Submit News</h2>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">
        See something? Say something. Submissions are reviewed before publishing.
      </p>

      <form id="submit-form" class="card" style="display: flex; flex-direction: column; gap: 1.5rem;">
        
        <div>
          <label class="kicker" for="title">Headline</label>
          <input type="text" id="title" required 
            style="width: 100%; padding: 0.8rem; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 6px;"
            placeholder="e.g. Lost Dog on Highway 5">
        </div>

        <div>
          <label class="kicker" for="content">Details</label>
          <textarea id="content" required rows="6"
            style="width: 100%; padding: 0.8rem; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 6px; font-family: inherit;"
            placeholder="Include who, what, where, and when..."></textarea>
        </div>

        <div>
          <label class="kicker" for="author">Your Name (Optional)</label>
          <input type="text" id="author" 
            style="width: 100%; padding: 0.8rem; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 6px;"
            placeholder="Will be listed as 'Community Submission' if blank">
        </div>

        <button type="submit" class="btn" style="border:none; cursor:pointer; font-size:1rem;">Submit for Review</button>
        <p id="status-msg" style="text-align: center; font-size: 0.9rem; min-height: 1.5rem;"></p>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('submit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const msg = document.getElementById('status-msg');
      
      // Lock UI
      btn.disabled = true;
      btn.innerText = "Sending...";
      msg.style.color = "var(--text-muted)";
      msg.innerText = "";

      const payload = {
        title: document.getElementById('title').value,
        content: document.getElementById('content').value,
        authorName: document.getElementById('author').value || "Anonymous"
      };

      try {
        const res = await fetch('/api/submit-news', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const json = await res.json();
        
        if (json.success) {
          document.getElementById('submit-form').innerHTML = `
            <div style="text-align:center; padding: 2rem;">
              <h3 style="color: var(--cobra-gold)">Received!</h3>
              <p>Your news has been sent to the editor for approval.</p>
              <a href="/news/" class="btn btn-outline">Back to News</a>
            </div>
          `;
        } else {
          throw new Error(json.message || "Unknown error");
        }
      } catch (err) {
        msg.style.color = "#ff6b6b";
        msg.innerText = "Error: " + err.message;
        btn.disabled = false;
        btn.innerText = "Try Again";
      }
    });
  </script>
</body>
</html>
