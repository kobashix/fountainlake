<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Local News | Fountain Lake Network</title>

  <meta name="description" content="Local news, incidents, and community updates for Fountain Lake, Arkansas." />
  <meta name="robots" content="index, follow" />

  <link rel="stylesheet" href="/assets/css/style.css" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <main id="app">
    <div class="kicker">Arkansas</div>
    <h1 class="site-title">Fountain Lake Network</h1>

    <nav class="site-nav">
      <a href="/">Home</a>
      <a href="/news/" class="active">News</a>
      <a href="/school/">School</a>
      <a href="/events/">Events</a>
      <a href="/business/">Business</a>
    </nav>

    <article class="content" id="content">
      <h2>Local News</h2>

      <p>
        This section covers local incidents, public safety updates, traffic events,
        and community-related news affecting the Fountain Lake area.
      </p>

      <p>
        👉 <strong>Visit the <a href="/">homepage</a> for the latest headlines.</strong>
      </p>
    </article>
  </main>

  <script>
    const ENDPOINT = "https://cms.fountainlake.net/graphql";
    const content = document.getElementById("content");

    function loadArticle(slug) {
      content.innerHTML = "<p>Loading article…</p>";

      fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          query: `
            {
              newsItemBy(slug: "${slug}") {
                title
                content
                date
              }
            }
          `
        })
      })
      .then(res => res.json())
      .then(res => {
        const item = res.data.newsItemBy;

        if (!item) {
          content.innerHTML = "<h2>Article not found</h2>";
          return;
        }

        content.innerHTML = `
          <a href="/" class="back-link">← Back to Home</a>
          <article>
            <h2>${item.title}</h2>
            ${item.content}
          </article>
        `;
      })
      .catch(() => {
        content.innerHTML = "<p>Error loading article.</p>";
      });
    }

    // Detect slug from URL
    const match = window.location.pathname.match(/^\/news\/([^/]+)\/?$/);

    if (match) {
      loadArticle(match[1]);
    }
  </script>
</body>
</html>
