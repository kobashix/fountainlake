<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Local News | Fountain Lake Network</title>

  <meta name="description" content="Local news and incident updates for Fountain Lake, Arkansas." />
  <meta name="robots" content="index, follow" />

  <link rel="stylesheet" href="/assets/css/style.css" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <main id="app">

    <article class="content">
      <h2>Local News</h2>
      <p class="muted">
        Incident reports, public safety updates, and community news affecting
        Fountain Lake and nearby areas.
      </p>

      <div class="box" id="news-list">Loading…</div>
    </article>
  </main>

  <script>
    const ENDPOINT = "https://cms.fountainlake.net/graphql";
    const container = document.getElementById("news-list");

    function renderError(err) {
      container.innerHTML = "<p class='error'>Failed to load news.</p>";
    }

    function renderList(items) {
  if (!items.length) {
    container.innerHTML = "<p class='muted'>No news articles found.</p>";
    return;
  }

  container.innerHTML = "";
  // Add the grid class to the container for styling
  container.className = "grid"; 

  items.forEach(item => {
    const article = document.createElement("article");
    article.className = "card news-card";
    
    // Formatting the date (optional, if your API returns 'date')
    const dateStr = item.date ? new Date(item.date).toLocaleDateString() : 'Recent';

    article.innerHTML = `
      <span class="kicker">${dateStr}</span>
      <h3><a href="/news/${item.slug}" data-slug="${item.slug}">${item.title}</a></h3>
      <p>${item.excerpt || 'Click to read full story...'}</p>
      <a href="/news/${item.slug}" class="btn btn-outline">Read More &rarr;</a>
    `;
    container.appendChild(article);
  });
}

    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query: `
          {
            newsItems(first: 25, where: { status: PUBLISH }) {
              nodes {
                title
                slug
              }
            }
          }
        `
      })
    })
      .then(res => res.json())
      .then(res => {
        if (res.errors) {
          renderError(res.errors);
          return;
        }
        renderList(res.data.newsItems.nodes);
      })
      .catch(renderError);
  </script>
    <script src="/assets/js/script.js"></script>
</body>
</html>
