<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Local News | Fountain Lake Network</title>

  <meta name="description" content="Local news and incident updates for Fountain Lake, Arkansas and surrounding areas." />
  <meta name="robots" content="index, follow" />

  <link rel="stylesheet" href="/assets/css/style.css" />
</head>

<body>
  <main>
    <header class="site-header">
      <div class="kicker">Arkansas</div>
      <h1 class="site-title">Fountain Lake Network</h1>

      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/news/" class="active">News</a>
        <a href="/school/">School</a>
        <a href="/events/">Events</a>
        <a href="/business/">Business</a>
      </nav>
    </header>

    <article class="content">
      <h2>Local News</h2>

      <p class="muted">
        Community news, public safety updates, and notable incidents affecting
        the Fountain Lake area.
      </p>

      <div id="news-list" class="news-list">
        Loading news…
      </div>

      <p class="back-link">
        <a href="/">← Back to Home</a>
      </p>
    </article>
  </main>

  <script>
    const ENDPOINT = "https://cms.fountainlake.net/graphql";
    const container = document.getElementById("news-list");

    function renderError(err) {
      container.innerHTML = "<p class='error'>Failed to load news.</p>";
      console.error(err);
    }

    function formatDate(date) {
      return new Date(date).toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query: `
          {
            newsItems(first: 20, where: { status: PUBLISH }) {
              nodes {
                title
                slug
                date
              }
            }
          }
        `
      })
    })
    .then(res => res.json())
    .then(res => {
      if (res.errors) {
        renderError(res.errors);
        return;
      }

      const items = res.data.newsItems.nodes;

      if (!items.length) {
        container.innerHTML = "<p class='muted'>No news available.</p>";
        return;
      }

      container.innerHTML = "";

      items.forEach(item => {
        const div = document.createElement("div");
        div.className = "news-row";

        div.innerHTML = `
          <div class="news-date">${formatDate(item.date)}</div>
          <h3 class="news-title">
            <a href="/news/${item.slug}/">${item.title}</a>
          </h3>
        `;

        container.appendChild(div);
      });
    })
    .catch(renderError);
  </script>
</body>
</html>
