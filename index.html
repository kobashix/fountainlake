<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Fountain Lake Arkansas Network | Local News & Updates</title>

  <meta name="description" content="Local news, school updates, events, and community information for Fountain Lake, Arkansas." />
  <meta name="robots" content="index, follow" />

  <link rel="stylesheet" href="/assets/css/style.css" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <main>
    <div class="kicker">Arkansas</div>
    <h1 class="site-title">Fountain Lake Network</h1>

    <nav class="site-nav">
      <a href="/" class="active">Home</a>
      <a href="/news/">News</a>
      <a href="/school/">School</a>
      <a href="/events/">Events</a>
      <a href="/business/">Business</a>
      <a href="/about.html">About</a>
    </nav>

    <p class="tagline">
      Local news, school updates, events, and business listings for Fountain Lake,
      Arkansas and nearby communities.
    </p>

    <section>
      <h2>Local News</h2>
      <div class="box" id="local-news">Loading…</div>
    </section>

    <section>
      <h2>Site Updates</h2>
      <div class="box" id="site-updates">Loading…</div>
    </section>
  </main>

  <script>
    const ENDPOINT = "https://cms.fountainlake.net/graphql";

    function renderError(container, err) {
      container.innerHTML = "<p class='error'>" + err + "</p>";
    }

    function renderList(container, items, type) {
      if (!items.length) {
        container.innerHTML = "<p class='muted'>No items.</p>";
        return;
      }

      container.innerHTML = "";
      items.forEach(item => {
        const div = document.createElement("div");
        div.className = "news-item";
        div.innerHTML = `
          <a href="/${type}/${item.slug}/">
            ${item.title}
          </a>
        `;
        container.appendChild(div);
      });
    }

    function loadLocalNews() {
      const container = document.getElementById("local-news");

      fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          query: `
            {
              newsItems(first: 5, where: { status: PUBLISH }) {
                nodes {
                  title
                  slug
                }
              }
            }
          `
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.errors) {
          renderError(container, "Unable to load news.");
          return;
        }
        renderList(container, res.data.newsItems.nodes, "news");
      })
      .catch(() => renderError(container, "Network error."));
    }

    function loadSiteUpdates() {
      const container = document.getElementById("site-updates");

      fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          query: `
            {
              posts(first: 5, where: { status: PUBLISH }) {
                nodes {
                  title
                  slug
                }
              }
            }
          `
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.errors) {
          renderError(container, "Unable to load updates.");
          return;
        }
        renderList(container, res.data.posts.nodes, "post");
      })
      .catch(() => renderError(container, "Network error."));
    }

    // Initial load
    loadLocalNews();
    loadSiteUpdates();
  </script>
</body>
</html>
